<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>車提供 - FC尾島ジュニア</title>
    <link rel="icon" type="image/png" href="/img/favicon-64.png?v=2">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1C1600">
    <link rel="apple-touch-icon" href="/img/icon-192.png">
    <link rel="stylesheet" href="../css/common.css?v=20261017a">
    <link rel="stylesheet" href="../css/carpool/common.css?v=20261022a">
    <link rel="stylesheet" href="../css/carpool/carprovision.css?v=20261022b">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1 id="event-header">FC尾島ジュニア 車提供</h1>
    </header>

    <nav class="carpool-nav">
        <a href="index.html">概要</a>
        <a href="attendance.html">出欠確認</a>
        <a href="cars.html" class="active">車提供</a>
        <a href="assignments.html">割り当て</a>
        <a href="notifications.html">連絡</a>
    </nav>

    <div class="container">
        <div id="carEventInfo" class="event-summary">
            <!-- イベント情報がJSで動的に生成される -->
            <div class="loading">読み込み中...</div>
        </div>
        
        <div class="card">
            <h2>車の提供登録</h2>
            <div class="car-form">
                <div class="form-group">
                    <label for="parentName">運転者:</label>
                    <!-- 狭い画面では入力欄が数文字分まで縮んでいたため、入りきらなければボタンを下の段に回す -->
                    <div style="display:flex; gap:8px 10px; flex-wrap:wrap;">
                        <input type="text" id="parentName" style="flex:1 1 160px; min-width:0;">
                        <button type="button" id="select-driver" class="secondary-button" style="flex:0 0 auto;">メンバーから選ぶ</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="canDrive">車の提供:</label>
                    <select id="canDrive">
                        <option value="both">行き帰り可能</option>
                        <option value="no">不可</option>
                        <option value="to">行きのみ可能</option>
                        <option value="from">帰りのみ可能</option>
                    </select>
                </div>
                <div id="carDetails">
                    <h4>座席</h4>
                    <!-- 車の図（割り当てと同じ形）。席の数は −／＋ で変え、兄弟児など選手以外が乗る席は席をタップして決める。
                         決めた席は座席割り当てでその人の席になり、選手は割り当てられない -->
                    <p class="cp-hint">兄弟児など<strong>選手以外が乗る席</strong>は、席をタップして決めてください。その席には選手を割り当てません。</p>
                    <div class="cp-seat-area">
                        <div id="cp-car" class="cp-car" aria-label="座席の図"></div>
                        <div id="cp-steppers" class="cp-steppers"></div>
                    </div>
                    <div id="cp-seat-summary" class="cp-seat-summary"></div>
                    <!-- 運転者の家庭の兄弟児（保護者のメンバー情報に登録）。チェックすると空いている席に乗せる -->
                    <div class="form-group" id="sibling-group" style="display:none;">
                        <label>同乗する兄弟児:</label>
                        <div id="sibling-options" style="display:flex;flex-direction:column;gap:6px;margin-top:4px;"></div>
                        <button type="button" id="sibling-add-toggle" class="secondary-button" style="margin-top:6px;font-size:13px;padding:6px 12px;">＋ 兄弟児を登録</button>
                        <div id="sibling-add-form" style="display:none;flex-wrap:wrap;gap:6px;margin-top:6px;">
                            <input type="text" id="sibling-add-name" placeholder="名前（例: 佐々木 さくら）" maxlength="30" style="flex:1 1 140px;min-width:0;">
                            <input type="text" id="sibling-add-note" placeholder="メモ（例: 3歳・チャイルドシート）" maxlength="40" style="flex:1 1 140px;min-width:0;">
                            <button type="button" id="sibling-add-save" style="flex:0 0 auto;">登録</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="carNotes">備考:</label>
                        <input type="text" id="carNotes" placeholder="特記事項があれば記入してください。">
                    </div>
                </div>
                <div class="action-buttons">
                    <button type="button" id="register-car">登録</button>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>登録済み車両</h2>
            <div id="car-stats" class="car-stats">
                <!-- 車両統計がJSで動的に生成される -->
                <div class="loading">読み込み中...</div>
            </div>
            <div class="table-container">
                <table id="registeredCars">
                    <thead>
                        <tr>
                            <th>運転者</th>
                            <th>提供</th>
                            <th>助手席</th>
                            <th>中列</th>
                            <th>後列</th>
                            <th>乗車可能</th>
                            <th>備考</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 登録データがJSで動的に生成される -->
                        <tr>
                            <td colspan="8" class="empty-table-message">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 運転者選択モーダル -->
    <div id="driver-select-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>運転者を選択</h2>
            <div id="driver-select-list" class="select-list">
                <!-- メンバーリストがJSで動的に生成される -->
                <div class="loading">読み込み中...</div>
            </div>
        </div>
    </div>

    <!-- 席をタップしたとき: その席に乗せる人（兄弟児・その他のメンバー外の人）を選ぶ -->
    <div id="cp-seat-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="cp-seat-title" style="font-size:18px;">席</h2>
            <p id="cp-seat-current" class="cp-seat-current"></p>
            <div id="cp-seat-siblings" class="cp-seat-siblings"></div>
            <div class="cp-seat-other">
                <label for="cp-seat-other-name">ほかの人を乗せる（兄弟児・友だちなど）</label>
                <div class="cp-seat-other-row">
                    <input type="text" id="cp-seat-other-name" placeholder="名前" maxlength="30">
                    <button type="button" id="cp-seat-other-add">乗せる</button>
                </div>
            </div>
            <button type="button" id="cp-seat-clear" class="secondary-button cp-seat-clear">この席を空ける（選手が乗れる席に戻す）</button>
        </div>
    </div>

    <!-- グローバルナビゲーション -->
    <div class="global-navigation">
        <button id="back-to-hub">HUBに戻る</button>
        <button id="next-to-assignments" class="share-button">次へ:割り当て</button>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../js/common/firebase-config.js?v=20260721a"></script>

    <!-- 共通モジュール -->
    <script src="../js/common/global.js?v=20260219"></script>
    <script src="../js/common/utils.js?v=20261017f"></script>
    <script src="../js/common/storage.js?v=20261016d"></script>
    <script src="../js/common/ui.js?v=20261016d"></script>
    <script src="../js/common/auth.js?v=20261016g"></script>
    <script src="../js/common/db.js?v=20261022c"></script>

    <!-- 配車管理用モジュール -->
    <script src="../js/carpool/overview.js?v=20261022b"></script>
    <script src="../js/carpool/carprovision.js?v=20261022b"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // 未登録・承認待ち・却下ならリダイレクト等が行われ null が返る → 以降の初期化はしない
            if (!(await FCOjima.Auth.requireApproved())) return;
            // 共有リンクの ?event=ID を反映し、イベント内容をFirestoreの最新に取り直す
            await FCOjima.Carpool.ensureSelectedEvent();
            // モーダル初期化
            FCOjima.UI.initModals();
            
            // 車提供機能の初期化（Firestore非同期ロードのためawait必須）
            if (FCOjima.Carpool.CarProvision && FCOjima.Carpool.CarProvision.init) {
                await FCOjima.Carpool.CarProvision.init();
            } else {
                console.error('車提供機能の初期化に失敗しました');
            }
            
            // イベント情報の表示
            if (FCOjima.Carpool.Overview && FCOjima.Carpool.Overview.displayEventSummary) {
                FCOjima.Carpool.Overview.displayEventSummary('carEventInfo');
            }
            
            // 車両提供条件変更イベント
            document.getElementById('canDrive').addEventListener('change', function() {
                var carDetails = document.getElementById('carDetails');
                carDetails.style.display = (this.value === 'no') ? 'none' : 'block';
            });
            
            // 運転者選択ボタン
            document.getElementById('select-driver').addEventListener('click', function() {
                if (FCOjima.Carpool.CarProvision && FCOjima.Carpool.CarProvision.openDriverSelectModal) {
                    FCOjima.Carpool.CarProvision.openDriverSelectModal();
                }
            });
            
            // 車両登録ボタン
            document.getElementById('register-car').addEventListener('click', function() {
                if (FCOjima.Carpool.CarProvision && FCOjima.Carpool.CarProvision.registerCar) {
                    FCOjima.Carpool.CarProvision.registerCar();
                }
            });
            
            // HUBに戻るボタンの設定
            document.getElementById('back-to-hub').addEventListener('click', function() {
                if (FCOjima.Carpool.Overview && FCOjima.Carpool.Overview.goToMainPage) {
                    FCOjima.Carpool.Overview.goToMainPage();
                } else {
                    window.location.href = '../hub/index.html';
                }
            });
            
            // 次へボタンの設定
            document.getElementById('next-to-assignments').addEventListener('click', function() {
                // 車両登録の保存が終わってから移動（移動で書き込みが途切れないように）
                FCOjima.Carpool.whenSaved().then(function() {
                    window.location.href = 'assignments.html';
                });
            });
        });
    </script>
</body>
</html>
