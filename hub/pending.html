<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>承認待ち - FC尾島ジュニア</title>
    <link rel="icon" type="image/png" href="/img/favicon-64.png?v=2">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1C1600">
    <link rel="apple-touch-icon" href="/img/icon-192.png">
    <link rel="stylesheet" href="../css/common.css?v=20261017a">
    <style>
        /* スマホ幅では左右に余白を残す（以前は画面の端までカードが広がっていた） */
        .pending-container {
            max-width: 420px;
            width: calc(100% - 32px);
            box-sizing: border-box;
            margin: 60px auto;
            padding: 32px 22px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            text-align: center;
        }
        .pending-icon { font-size: 48px; margin-bottom: 16px; }
        .pending-title {
            font-size: 20px;
            font-weight: bold;
            color: #1C1600;
            margin-bottom: 12px;
        }
        .pending-msg {
            color: #555;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 24px;
        }
        .pending-lead { margin: 0 0 12px; font-weight: 700; color: #333; }
        .pending-steps {
            text-align: left;
            margin: 0 0 12px;
            padding: 12px 14px 12px 32px;
            background: #faf7ef;
            border-radius: 10px;
            font-size: 13.5px;
            line-height: 1.7;
        }
        .pending-steps li { margin: 2px 0; }
        .pending-note { margin: 0; font-size: 12px; color: #888; line-height: 1.6; }
        .reload-btn {
            background: none;
            border: 1px solid #E8A200;
            color: #E8A200;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .signout-btn {
            background: none;
            border: none;
            color: #999;
            padding: 10px 24px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
        }
        /* common.css の button の影・金色の hover が、枠線だけ・文字だけのボタンにも当たっていた
           （「サインアウト」が白いボタンのように見えていた） */
        .reload-btn, .signout-btn { box-shadow: none; }
        .reload-btn:hover, .reload-btn:active { background: #fff8e6; box-shadow: none; }
        .signout-btn:hover, .signout-btn:active { background: none; box-shadow: none; color: #666; }
    </style>
</head>
<body style="background: #f0f4f8;">
    <div class="pending-container">
        <div class="pending-icon">⏳</div>
        <div class="pending-title">承認をお待ちください</div>
        <div class="pending-msg">
            <p class="pending-lead">登録申請を受け付けました。</p>
            <!-- これからの流れ（以前は中央そろえの長い文が改行で続き、読みにくかった） -->
            <ol class="pending-steps">
                <li>監督・コーチ・役員が申請を確認して承認します</li>
                <li>承認されると、監督・役員から LINE などでお知らせが届きます</li>
                <li>お知らせのリンク（またはこのページ）を開くと、自動でアプリの画面に進みます</li>
            </ol>
            <p class="pending-note">お急ぎの場合は、申請したことを監督・役員にお知らせください。</p>
        </div>
        <button class="reload-btn" onclick="checkStatus()">承認状況を確認</button>
        <br>
        <button class="signout-btn" id="signout-btn">サインアウト</button>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../js/common/firebase-config.js?v=20260721a"></script>

    <script>
        const pendingAuth = window.FCOjimaFirebase.auth;
        const pendingDb   = window.FCOjimaFirebase.db;
        // 注意: TEAM_ID は firebase-config.js がグローバル const として宣言済み。
        // ここで再宣言すると SyntaxError でこの script 全体が動かなくなる（過去バグ）。

        pendingAuth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = '/hub/login.html';
                return;
            }
            document.getElementById('signout-btn').addEventListener('click', function() {
                pendingAuth.signOut().then(function() {
                    window.location.href = '/hub/login.html';
                });
            });
            // 開いた時点の状態を反映する（却下済みならその旨を表示。承認済みならHUBへ）
            checkStatus(true);
            // 開いたまま待っている間・アプリに戻ってきたときにも確かめ、承認されたらそのまま進む
            // （以前は「承認後にこのページを更新してください」とだけ出ていた）
            setInterval(function() { if (!document.hidden) checkStatus(true); }, 60000);
            document.addEventListener('visibilitychange', function() { if (!document.hidden) checkStatus(true); });
        });

        async function checkStatus(silent) {
            const user = pendingAuth.currentUser;
            if (!user) return;
            try {
                const doc = await pendingDb.collection('teams').doc(TEAM_ID)
                    .collection('users').doc(user.uid).get();
                if (!doc.exists) {
                    window.location.href = '/hub/register.html';
                    return;
                }
                const status = doc.data().status;
                if (status === 'approved') {
                    window.location.href = '/hub/index.html';
                } else if (status === 'rejected') {
                    document.querySelector('.pending-icon').textContent = '⚠️';
                    document.querySelector('.pending-title').textContent = '申請が承認されませんでした';
                    document.querySelector('.pending-msg').innerHTML =
                        '<strong style="color:#c00;">申請が却下されました。</strong><br>管理者にお問い合わせください。<br><br>' +
                        '別のGoogleアカウントで申請し直す場合は、下の「サインアウト」から入り直してください。';
                } else if (!silent) {
                    // ボタンを押すたびに同じ文言が増えていかないよう、表示欄は1つだけ使い回す
                    var note = document.getElementById('pending-check-note');
                    if (!note) {
                        note = document.createElement('span');
                        note.id = 'pending-check-note';
                        note.style.cssText = 'display:block;color:#888;font-size:12px;margin-top:6px;';
                        document.querySelector('.pending-msg').appendChild(note);
                    }
                    note.textContent = '（まだ承認されていません ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) + ' 時点）';
                }
            } catch(e) {
                if (!silent) alert('確認に失敗しました: ' + e.message);
            }
        }
    </script>
</body>
</html>
