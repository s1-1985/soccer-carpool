<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>新規登録 - FC尾島ジュニア</title>
    <link rel="icon" type="image/png" href="/img/favicon-64.png?v=2">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1C1600">
    <link rel="apple-touch-icon" href="/img/icon-192.png">
    <link rel="stylesheet" href="../css/common.css?v=20261017a">
    <style>
        .register-container {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .register-title {
            font-size: 20px;
            font-weight: bold;
            color: #1C1600;
            margin-bottom: 6px;
            text-align: center;
        }
        .register-subtitle {
            color: #666;
            font-size: 13px;
            text-align: center;
            margin-bottom: 28px;
        }
        .email-display {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 14px;
            color: #555;
            margin-bottom: 4px;
        }
        .child-select-list {
            border: 1px solid #ddd;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
        }
        .child-select-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
            border-bottom: 1px solid #f0f0f0;
        }
        .child-select-item:last-child { border-bottom: none; }
        .role-choices { display: flex; flex-direction: column; gap: 6px; }
        .role-choice {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: 1.5px solid #d8cfb8;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
        }
        .role-choice:has(input:checked) { border-color: #E8A200; background: #fff6dd; }
        .role-choice input { margin: 0; accent-color: #E8A200; }
        .form-note {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 24px;
        }
    </style>
</head>
<body style="background: #f0f4f8; padding: 16px;">
    <div class="register-container">
        <div class="register-title">⚽ FC尾島ジュニア</div>
        <div class="register-subtitle">利用者登録申請<br><span id="register-mode-note">送信後、管理者の承認をお待ちください</span></div>

        <form id="register-form">
            <div class="form-group">
                <label>メールアドレス（Googleアカウント）</label>
                <div class="email-display" id="email-display">読み込み中...</div>
                <p class="form-note">※ログインに使用したGoogleアカウントのメールアドレス</p>
            </div>

            <div class="form-group">
                <label>立場 <span style="color:red">*</span></label>
                <div class="role-choices" role="radiogroup" aria-label="立場">
                    <label class="role-choice"><input type="radio" name="reg-role" value="parent" checked><span>保護者</span></label>
                    <label class="role-choice"><input type="radio" name="reg-role" value="coach"><span>監督・コーチ</span></label>
                    <label class="role-choice"><input type="radio" name="reg-role" value="officer"><span>役員</span></label>
                </div>
                <p class="form-note">監督・コーチは、承認されると指導の予定（都合の回答）が使えるようになります。</p>
            </div>

            <div class="form-group">
                <label for="reg-name">氏名 <span style="color:red">*</span></label>
                <input type="text" id="reg-name" placeholder="例: 田中 和人" required class="form-control">
                <p class="form-note">チームの名簿と同じ漢字で入力してください（姓と名の間はスペース）。</p>
            </div>

            <div class="form-group">
                <label for="reg-kana">フリガナ <span style="color:red">*</span></label>
                <input type="text" id="reg-kana" placeholder="例: タナカ カズト" required class="form-control" pattern="[ァ-ヶー・ｦ-ﾟ\s　]+" title="全角カタカナで入力してください">
                <p style="font-size:11px;color:#888;margin:2px 0 0;">全角カタカナで入力してください</p>
            </div>

            <div class="form-group">
                <label>お子さん（選手）の氏名</label>
                <p class="form-note">※フルネームで入力してください。兄弟がいる場合は「＋ 兄弟を追加」で欄を増やせます。管理者が承認するときに選手名簿と照らし合わせます。</p>
                <div id="child-inputs">
                    <!-- 子供の氏名の入力欄がJSで追加される -->
                </div>
                <button type="button" id="add-child-input" class="secondary-button" style="margin-top:6px;">＋ 兄弟を追加</button>
                <p class="form-note">※監督・コーチなど、お子さんがいない場合は空欄のまま申請できます。</p>
            </div>

            <div id="register-error" style="display:none;background:#fdecea;border-radius:6px;padding:12px;color:#c62828;font-size:14px;margin-top:12px;"></div>

            <button type="submit" class="submit-btn">承認申請を送信</button>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../js/common/firebase-config.js?v=20260721a"></script>

    <script>
        const regAuth = window.FCOjimaFirebase.auth;
        const regDb   = window.FCOjimaFirebase.db;

        let currentUser = null;

        regAuth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.href = '/hub/login.html';
                return;
            }
            currentUser = user;
            document.getElementById('email-display').textContent = user.email || user.displayName;

            // 既にプロフィールが存在する場合はリダイレクト
            try {
                const doc = await regDb.collection('teams').doc(TEAM_ID)
                    .collection('users').doc(user.uid).get();
                if (doc.exists) {
                    const status = doc.data().status;
                    if (status === 'approved') {
                        window.location.href = '/hub/index.html';
                    } else {
                        // 承認待ち・却下済み（却下の案内とサインアウトは承認待ちページで行う）。
                        // 以前は却下済みだと空の申請フォームのまま止まり、送信しても権限エラーになった
                        window.location.href = '/hub/pending.html';
                    }
                    return;
                }
            } catch(e) { console.warn(e); }

            // 子供の氏名の入力欄（最初の1つ）
            if (!document.querySelector('#child-inputs input')) addChildInput();
        });

        // 子供は選手名簿から選ばせず、氏名を入力してもらう。
        // 以前は名簿から選ばせるため、承認前の（任意のGoogleアカウントでログインしただけの）人にも
        // 選手全員の氏名・生年月日を読める状態にしていた。照合は承認時に管理者が行う
        const MAX_CHILDREN = 5;
        function addChildInput() {
            const container = document.getElementById('child-inputs');
            const count = container.querySelectorAll('input').length;
            if (count >= MAX_CHILDREN) return;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'form-control child-name-input';
            input.placeholder = (count + 1) + '人目のお子さんの氏名（例: 田中 太郎）';
            input.style.marginTop = count > 0 ? '6px' : '0';
            input.maxLength = 40;
            container.appendChild(input);
            document.getElementById('add-child-input').style.display = (count + 1 >= MAX_CHILDREN) ? 'none' : '';
            return input;
        }
        document.getElementById('add-child-input').addEventListener('click', function() {
            const input = addChildInput();
            if (input) input.focus();
        });

        function getChildNames() {
            const names = [];
            document.querySelectorAll('#child-inputs input').forEach(function(input) {
                const v = (input.value || '').trim();
                if (v && names.indexOf(v) === -1) names.push(v);
            });
            return names;
        }

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errEl = document.getElementById('register-error');
            errEl.style.display = 'none';

            const name = document.getElementById('reg-name').value.trim();
            const kana = (document.getElementById('reg-kana') || {}).value?.trim() || '';
            // 立場（承認するときの役割の初期値。役割そのものは承認する人が決める）。
            // 性別・生年月日は使っていなかったため聞かない（お母さんが初期値の「男性」のまま送ってしまうこともあった）
            const roleInput = document.querySelector('input[name="reg-role"]:checked');
            const requestedRole = roleInput ? roleInput.value : 'parent';

            if (!name) {
                errEl.textContent = '氏名を入力してください。';
                errEl.style.display = 'block';
                return;
            }
            if (!kana) {
                errEl.textContent = 'フリガナを入力してください。';
                errEl.style.display = 'block';
                return;
            }

            const childrenNames = getChildNames();

            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = '送信中...';

            try {
                // 申請は常に「承認待ちの保護者」として作成する
                // （初代管理者は Firebase Console から手動設定する運用）
                await regDb.collection('teams').doc(TEAM_ID)
                    .collection('users').doc(currentUser.uid).set({
                        name,
                        kana: kana || null,
                        requestedRole,
                        email: currentUser.email || null,
                        role: 'parent',
                        // 子供は承認時に管理者が選手名簿と照合して childrenIds を設定する
                        childrenIds: [],
                        childrenNames,
                        status: 'pending',
                        registeredAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                window.location.href = '/hub/pending.html';
            } catch(err) {
                errEl.textContent = '送信に失敗しました: ' + err.message;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '承認申請を送信';
            }
        });
    </script>
</body>
</html>
